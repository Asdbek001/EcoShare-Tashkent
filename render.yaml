services:
  - type: web
    name: ecoshare-tashkent
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/Asdbek001/EcoShare-Tashkent
    branch: master
    healthCheckPath: /
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_db"
    startCommand: "gunicorn ecoshare.wsgi:application --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@ecoshare.uz
      - key: ADMIN_PASSWORD
        generateValue: true